<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片展示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f5f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    .gallery img {
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      flex: 1 1 400px;
      min-width: 280px;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <img src="images/image1.jpg" alt="图片1">
    <img src="images/image2.jpg" alt="图片2">
  </div>
</body>
</html>
